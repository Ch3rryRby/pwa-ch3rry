<div class="receita">

<h1>🍓 Torta de Morango</h1>

<h2>Ingredientes</h2>

<ul>

<li>1 massa para torta</li>

<li>500 ml de creme confeiteiro</li>

<li>2 caixas de morango</li>

<li>Gelatina incolor (opcional)</li>

</ul>

<h2>Modo de preparo</h2>

<p>

Asse a massa.

Depois coloque o creme.

Cubra com os morangos.

Se desejar, finalize com uma camada fina de gelatina.

</p>
