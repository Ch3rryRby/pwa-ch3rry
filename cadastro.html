<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

<div class="login-box">

<img src="https://upload.wikimedia.org/wikipedia/en/0/05/Hello_Kitty_character_portrait.png" class="kitty">

<h1>Criar Conta</h1>

<p class="subtitle">
Cadastre-se na Biblioteca de Receitas
</p>

<form action="biblioteca.html">

<input
type="text"
placeholder="Nome"
required>

<input
type="email"
placeholder="E-mail"
required>

<input
type="password"
placeholder="Senha"
required>

<input
type="password"
placeholder="Confirmar Senha"
required>

<button type="submit">

Cadastrar

</button>

</form>

<a href="index.html" class="cadastro">

Já possui conta? Entrar

</a>

</div>

</div>

</body>
</html>
